---
- name: Restart geth
  ansible.builtin.systemd_service:
    name: geth
    state: restarted
    daemon_reload: true

- name: Restart lighthouse
  ansible.builtin.systemd_service:
    name: lighthouse
    state: restarted
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: restarted
    daemon_reload: true