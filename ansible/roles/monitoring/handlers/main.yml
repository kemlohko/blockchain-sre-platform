---
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus.service
    state: restarted
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    daemon_reload: true

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted
    daemon_reload: true