---
- name: Create prometheus system user 
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/prometheus", mode: "0755"}
    - { path: "/etc/prometheus/rules", mode: "0755"}
    - { path: "/var/lib/prometheus", mode: "0755"}

- name: Download prometheus
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Extract prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Install prometheus binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
    dest: /usr/local/bin/prometheus
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify:
    - Restart prometheus

- name: Install promtool binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/promtool"
    dest: /usr/local/bin/promtool
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Install Ethereum alert rules
  ansible.builtin.template:
    src: prometheus/rules/ethereum.yml.j2
    dest: /etc/prometheus/rules/ethereum.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Validate Ethereum alert rules
  ansible.builtin.command:
    cmd: /usr/local/bin/promtool check rules /etc/prometheus/rules/ethereum.yml

- name: Install prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    validate: "/usr/local/bin/promtool check config %s"
  notify:
    - Restart prometheus

- name: Install prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart prometheus

- name: Enable and Start prometheus
  ansible.builtin.systemd_service:
    name: prometheus.service
    enabled: true
    state: started
    daemon_reload: true
