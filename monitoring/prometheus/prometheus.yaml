global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
        - "prometheus:9090"

  - job_name: "rabbitmq"
    static_configs:
      - targets:
        - "rabbitmq:15692"
  
  - job_name: "blockchain-api"
    static_configs:
      - targets:
        - "api:8000"
  
  - job_name: "blockchain-worker"
    static_configs:
      - targets:
        - "worker:8001"